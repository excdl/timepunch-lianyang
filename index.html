<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}

body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}

.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
}

.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}

#statusInfo {
    font-size: 14px; 
    font-weight: bold;
    color: white;
    padding: 6px 14px; 
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}

.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}

.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}

#timeHour, #timeMin, #timeSec {
    font-size: 38px;       
    font-weight: normal;   
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}

.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}

@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}

#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}

button:not(:disabled):active {
    transform: scale(0.97);
}

.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}

#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

@keyframes bounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.1); }
    50%  { transform: scale(0.95); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce { animation: bounce 0.4s ease; }

.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div class="user-profile-container">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-profile">
        <div id="userInfo">載入中...</div>
        <div class="app-subtitle" id="headerDate">載入日期中...</div>
      </div>
    </div>
    <div id="statusInfo">檢查中...</div>
  </div>

  <div class="dashboard-card">
    <div class="clock-container">
      <div class="time-box"><span id="timeHour">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeMin">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeSec">00</span></div>
    </div>

    <div class="buttons-container">
      <button id="btnStart" disabled>上班</button>
      <button id="btnEnd" disabled>下班</button>
    </div>
  </div>

  <div class="section-container">
    <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄</div>
    <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
  </div>

  <button id="btnApprove">補打卡審批</button>
</div>
 
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxmYCfrJ_Hz1JG_qn6PEKX68XLtNYFBEcNvNwmMXIawuYXK79K-7yzuFhuCNDmI7u88/exec";
const COMPANY_IPS  = ["1.34.128.50"];

const MANAGERS = ["U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"];

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");
const btnApprove = document.getElementById("btnApprove");

window.userReady = false;
window.allowRemote = true; // 預設允許非公司網路打卡
window.userId = "";
window.userName = "";
let isClocking = false;

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function updateDateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");
    
    document.getElementById("timeHour").textContent = hours;
    document.getElementById("timeMin").textContent = minutes;
    document.getElementById("timeSec").textContent = seconds;
    
    headerDate.textContent = now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
    });
}

setInterval(updateDateTime, 1000);
updateDateTime();

function setButtonsLock(locked, startText = "上班", endText = "下班") {
    btnStart.disabled = locked;
    btnEnd.disabled = locked;
    btnStart.textContent = startText;
    btnEnd.textContent = endText;
    window.userReady = !locked && !!window.userId;
}

async function fetchWithTimeout(url, options = {}, timeout = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        return response;
    } finally {
        clearTimeout(timer);
    }
}

async function preloadIP(forceRefresh = false) {
    const cache = sessionStorage.getItem("myIP");
    if (cache && !forceRefresh) return cache;
    try {
        const response = await fetchWithTimeout("https://api.ipify.org?format=json", {}, 2000);
        if (!response.ok) return cache || "";
        const data = await response.json();
        const ip = String(data.ip || "").trim();
        if (ip) sessionStorage.setItem("myIP", ip);
        return ip || cache || "";
    } catch (error) {
        console.warn("取得 IP 逾時或失敗，使用快取或略過:", error);
        return cache || "";
    }
}

function isCompanyIP(ip) {
    return COMPANY_IPS.includes(String(ip || "").trim());
}

async function updateStatus() {
    if (!window.userId) return;
    const ip = await preloadIP();
    const isCompany = isCompanyIP(ip);
    
    // 不須讀取 GPS，保留非公司網路可打卡功能
    if (isCompany) {
        statusInfo.textContent = "公司網路";
        statusInfo.style.background = "#2ecc71";
    } else {
        statusInfo.textContent = "非公司網路";
        statusInfo.style.background = "#e74c3c";
    }
    setButtonsLock(false, "上班", "下班");
}

async function initUser() {
    await liff.init({ liffId: "2008538866-zDXM53Ao" });
    if (!liff.isLoggedIn()) {
        await liff.login();
        return;
    }
    const profile = await liff.getProfile();
    window.userId = String(profile.userId || "").trim();
    window.userName = profile.displayName || "使用者";
    userInfo.textContent = `${window.userName} 您好`;
    
    if (profile.pictureUrl) {
        userAvatar.innerHTML = `<img src="${escapeHtml(profile.pictureUrl)}" alt="avatar" style="width:100%;height:100%;object-fit:cover;">`;
        localStorage.setItem("cached_pictureUrl", profile.pictureUrl);
    } else {
        userAvatar.textContent = window.userName.charAt(0) || "👤";
    }
    
    localStorage.setItem("cached_userId", window.userId);
    localStorage.setItem("cached_userName", window.userName);
    
    if (MANAGERS.includes(window.userId)) {
        if (btnApprove) btnApprove.style.display = "block";
    } else {
        if (btnApprove) btnApprove.style.display = "none";
    }
    
    await updateStatus();
}

function fixTimeFormat(t) {
    if (t === null || t === undefined || t === "") return "00:00:00";
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) {
        const parts = t.split(":");
        while (parts.length < 3) parts.push("00");
        return parts.slice(0, 3).map(p => String(p).padStart(2, "0")).join(":");
    }
    if (typeof t === "string" && t.includes("T")) {
        const d = new Date(t);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }
    if (!isNaN(t)) {
        const d = new Date((Number(t) - 25569) * 86400 * 1000);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }
    return String(t);
}

function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}/${m}/${d}`;
}

function showClockLoading(titleText = "打卡中", subText = "正在確認打卡資料，請稍候...") {
    Swal.fire({
        html: `
            <div style="padding:15px 0;text-align:center;">
                <div style="width:50px; height:50px; margin:0 auto 18px auto; border:4px solid #f3f3f3; border-top:4px solid #3498db; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
                <h3 style="margin:0 0 8px 0; color:#2c3e50; font-size:20px; font-weight:bold;">${escapeHtml(titleText)}</h3>
                <p style="margin:0; color:#7f8c8d; font-size:14px;">${escapeHtml(subText)}</p>
                <style> @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } } </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: { popup: "custom-swal-popup" }
    });
}

async function sendSelfMessage(record) {
    try {
        if (typeof liff === "undefined" || !liff.isInClient()) return;
        const headerColor = record.status === "下班" ? "#2ecc71" : "#3498db";
        await liff.sendMessages([{
            type: "flex",
            altText: `【打卡通知】${record.status}成功`,
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.netType}`, size: "md" }
                    ]
                }
            }
        }]);
    } catch (error) {
        console.warn("LINE 訊息傳送失敗，不影響打卡結果:", error);
    }
}

async function updateTodayRecords(showLoading = false) {
    if (!window.userId) return;
    try {
        const date = getTodayString();
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(date)}`;
        const response = await fetchWithTimeout(url, {}, 6000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        sessionStorage.setItem("cached_today_records", JSON.stringify(data));
        renderRecords(data);
    } catch (error) {
        console.error("今日紀錄讀取失敗:", error);
        const cached = sessionStorage.getItem("cached_today_records");
        if (!cached) {
            todayRecords.innerHTML = `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄讀取失敗</div>`;
        }
    }
}

function renderRecords(data) {
    if (!Array.isArray(data) || data.length === 0) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }
    const recordsHTML = data.map(record => {
        const status = String(record.status || "");
        const color = status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(record.time);
        const ip = String(record.ip || "");
        const networkLabel = isCompanyIP(ip) ? "公司網路" : "異地打卡";
        const networkColor = isCompanyIP(ip) ? "#7f8c8d" : "#e67e22";
        const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";
        return `
            <div class="record-item" style="border-left-color:${color};">
                <div class="record-info">
                    <div class="record-status">${escapeHtml(status)} ${makeupBadge}</div>
                    <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
                </div>
                <div class="record-time" style="color:${color};">${escapeHtml(time)}</div>
            </div>
        `;
    }).join("");
    todayRecords.innerHTML = recordsHTML;
}

async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (isClocking) return;
    if (!window.userId) {
        await Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: "尚未取得 LINE 使用者資訊，請重新整理頁面。",
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
        return;
    }

    isClocking = true;
    setButtonsLock(true, "處理中...", "處理中...");
    showClockLoading(isMakeup ? "補打卡中" : "打卡中", "正在確認打卡資料，請稍候...");

    let hasFinished = false;
    const safetyTimer = setTimeout(() => {
        if (!hasFinished) {
            hasFinished = true;
            Swal.close();
            Swal.fire({
                icon: "error",
                title: "網路回應逾時",
                html: `<span style="color:#c0392b;">伺服器回應較慢，請至下方「今日打卡紀錄」確認是否已打卡成功</span>`,
                confirmButtonText: "確定",
                customClass: { popup: "custom-swal-popup" }
            });
            isClocking = false;
            updateStatus();
        }
    }, 12000);

    try {
        const ip = await preloadIP(true);
        const body = {
            userId: window.userId,
            displayName: window.userName,
            status: status,
            ip: ip,
            lat: "",
            lng: "",
            customDate: customDate,
            customTime: customTime,
            isMakeup: isMakeup
        };

        const response = await fetchWithTimeout(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(body)
        }, 10000);

        if (hasFinished) return;
        hasFinished = true;
        clearTimeout(safetyTimer);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const responseText = await response.text();
        if (!responseText) throw new Error("伺服器沒有回傳資料");

        let apiData = JSON.parse(responseText);
        Swal.close();

        const message = String(apiData?.message || "");
        const isSuccess = message.includes("成功") || message.includes("更新");

        if (isSuccess) {
            const isCompany = isCompanyIP(ip);
            if (isCompany) {
                Swal.fire({
                    icon: "success",
                    title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
                    html: `<div style="font-size:16px; margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9; font-size:18px; font-weight:bold;">${escapeHtml(apiData.date || getTodayString())} ${escapeHtml(fixTimeFormat(apiData.time))}</span></div>`,
                    showConfirmButton: false,
                    timer: 2000,
                    backdrop: "rgba(0,0,0,0.5)",
                    customClass: { popup: "custom-swal-popup" }
                });
            } else {
                Swal.fire({
                    icon: "warning",
                    title: "⚠ 非公司網路",
                    html: `<div style="font-size:16px; color:#3498db; font-weight:bold; margin-top:8px;">◎ 異地打卡成功 ◎</div><br><small>打卡時間：${escapeHtml(apiData.date || getTodayString())} ${escapeHtml(fixTimeFormat(apiData.time))}</small>`,
                    showConfirmButton: false,
                    timer: 2500,
                    backdrop: "rgba(0,0,0,0.5)",
                    customClass: { popup: "custom-swal-popup" }
                });
            }

            sendSelfMessage({
                userName: window.userName,
                status: status,
                date: apiData.date || getTodayString(),
                time: fixTimeFormat(apiData.time),
                netType: isCompany ? "公司網路" : "非公司網路"
            });
        } else {
            throw new Error(message || "打卡失敗");
        }

        await updateTodayRecords();
    } catch (error) {
        if (!hasFinished) {
            hasFinished = true;
            clearTimeout(safetyTimer);
            Swal.close();
        }
        console.error("打卡失敗:", error);
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: error.message || "請檢查網路連線或重新整理頁面試試看！",
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
    } finally {
        isClocking = false;
        updateStatus();
    }
}

btnStart.onclick = () => performClockIn("上班");
btnEnd.onclick = () => performClockIn("下班");

if (btnApprove) {
    btnApprove.onclick = () => {
        window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
    };
}

window.onload = async () => {
    fetch(`${API_ENDPOINT}?action=ping`, { cache: "no-store" }).catch(() => {});
    try {
        await initUser();
        await updateTodayRecords(true);
    } catch (err) {
        console.error("初始化失敗:", err);
    }
};
</script>

</body>
</html>
